# The web app's Firebase config (API key, app id, sender id, VAPID + reCAPTCHA
# site keys) is PUBLIC by design — it ships in the browser bundle, and access
# is gated by Firestore rules + App Check, not by keeping these values secret.
# Exclude the files that carry them so GitHub secret scanning stops flagging
# the Firebase "Google API Key" as a leak (it is not one).
paths-ignore:
  - "web/.env.production"
  - "web/.env.example"
  - "firebase/functions/.env.example"
