name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_project:
        description: "Deploy after all checks pass (plan §21 B12). 'none' = just run CI."
        type: choice
        options: [none, obc-dance-card]
        default: none
      deploy_ref:
        description: "Commit/tag to deploy instead of the dispatched one (rollback). Empty = the dispatched commit."
        type: string
        default: ""

# Audit L8: least privilege for the workflow token — no job here needs more
# than read access (gitleaks-action only reads history with GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (shared → web → functions)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit (prod deps, high+)
        # The registry's audit endpoint is flaky (503s and 400s seen
        # 2026-09-04); retry transient failures rather than fail the build.
        # A real vulnerability finding fails on every attempt, so the gate
        # is not weakened.
        run: |
          for i in 1 2 3; do
            npm audit --omit=dev --audit-level=high && exit 0
            echo "npm audit attempt $i failed; retrying in 20s" >&2
            sleep 20
          done
          exit 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  emulator-tests:
    # Combines the Firestore rules suite and the functions-against-emulator
    # suite in one job: both need the same Java + Firestore/Auth emulator
    # setup, so running them separately just pays that setup cost twice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build -w @obc/shared

      - name: Firestore rules tests
        run: npm run test:rules -w @obc/functions

      - name: Functions emulator tests
        run: npm run test:emu -w @obc/functions

  ios-build-test:
    # Builds and unit-tests the SwiftUI member client. Needs a macOS runner
    # (Xcode), so it is the one job here that can't share the ubuntu setup.
    # Requires Xcode 16+: the project uses the objectVersion 77 format with
    # synchronized folder groups, which older Xcode cannot open.
    #
    # Runs on every PR, not just iOS-path ones, on purpose: `ios/` mirrors
    # `shared/src/{models,enums}.ts` by hand, and `ModelDecodingTests` exists
    # to fail when the two drift. A `shared/` change that renames a field must
    # re-run these tests, or the drift ships silently.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Xcode version
        run: xcodebuild -version

      # Pin the package checkout somewhere stable so it can be cached —
      # by default SwiftPM clones inside DerivedData, which is not.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ios/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/OBCDanceCard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OBCDanceCard.xcodeproj \
            -scheme "OBCDanceCard (Emulator)" \
            -clonedSourcePackagesDirPath .spm

      # CI runs the *emulator* scheme on purpose: the default 'OBCDanceCard'
      # scheme talks to the real project (the committed plist points at
      # production, as web/.env.production does), and CI must never touch it.
      # The Emulator scheme ignores the plist and synthesises demo-obc.
      # Simulator names and OS versions move with the runner image, so pick a
      # concrete available device by id rather than hard-coding "iPhone 17".
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      # The emulator-backed tests (EmulatorSignInTests) skip themselves when
      # nothing is listening, so the steps below are the *only* difference
      # between a normal PR run and an on-demand one. Same posture as
      # `e2e-test`: deterministic checks always, full-stack on request.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (Firestore emulator)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build backend
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          npm ci
          npm run build

      - name: Write local-dev secrets for the emulator
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "LOGIN_CODE_PEPPER=ci-dev-pepper" > firebase/functions/.secret.local
          echo "SMTP_PASS=ci-dev-smtp-pass" >> firebase/functions/.secret.local
          echo "SMTP_USER=ci-dev-smtp-user" >> firebase/functions/.secret.local

      - name: Start emulators
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: nohup npm run emulators > firebase-emulators.out 2>&1 &

      - name: Wait for emulators
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          for i in $(seq 1 90); do
            if grep -q "All emulators ready" firebase-emulators.out 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulators did not start in time" >&2
          cat firebase-emulators.out || true
          exit 1

      - name: Seed emulator data
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          GCLOUD_PROJECT: demo-obc
        run: npm run seed

      # Deliberately unpiped: filtering xcodebuild's output through `grep -v`
      # makes a *passing* build fail whenever every line happens to be
      # filtered, because grep exits 1 when it prints nothing. The log is
      # verbose; the result bundle uploaded below is the thing to read.
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test \
            -project OBCDanceCard.xcodeproj \
            -scheme "OBCDanceCard (Emulator)" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath OBCDanceCard.xcresult

      - name: Scrub login codes from emulator log
        # Audit L3: the emulator's console email provider prints full login
        # emails (6-digit codes) to stdout. Codes belong only to synthetic
        # demo-obc accounts, but mask them anyway before uploading.
        if: failure()
        run: |
          if [ -f firebase-emulators.out ]; then
            sed -E 's/[0-9]{6}/[6-digit masked]/g' firebase-emulators.out > firebase-emulators-scrubbed.out
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-debug
          path: |
            ios/OBCDanceCard.xcresult
            firebase-emulators-scrubbed.out
          retention-days: 7

  e2e-test:
    # Full-stack browser E2E: emulators + seed, then Playwright (which owns the
    # Vite dev server via webServer). Robust now — the auth-throttle reset
    # fixture removes the login-code rate limit as a flake source, and
    # Playwright retries twice on CI.: emulators + seed + `npm run dev -w
    # web` + `npm run test:e2e -w web` all green. See web/README.md for the
    # manual sequence this mirrors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build (shared → web → functions)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Write local-dev secrets for the emulator
        run: |
          echo "LOGIN_CODE_PEPPER=ci-dev-pepper" > firebase/functions/.secret.local
          echo "SMTP_PASS=ci-dev-smtp-pass" >> firebase/functions/.secret.local
          echo "SMTP_USER=ci-dev-smtp-user" >> firebase/functions/.secret.local

      - name: Start emulators
        run: nohup npm run emulators > firebase-emulators.out 2>&1 &

      - name: Wait for emulators
        run: |
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" firebase-emulators.out 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulators did not start in time" >&2
          cat firebase-emulators.out || true
          exit 1

      - name: Seed emulator data
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          GCLOUD_PROJECT: demo-obc
        run: npm run seed

      - name: Run Playwright E2E
        env:
          OBC_EMULATOR_LOG: ${{ github.workspace }}/firebase-emulators.out
          LOGIN_CODE_PEPPER: ci-dev-pepper
        run: npm run test:e2e -w web

      - name: Scrub login codes from emulator log
        # Audit L3: the emulator's console email provider prints full login
        # emails (6-digit codes) to stdout. Codes belong only to synthetic
        # demo-obc accounts, but mask them anyway before uploading.
        if: failure()
        run: |
          if [ -f firebase-emulators.out ]; then
            sed -E 's/[0-9]{6}/[6-digit masked]/g' firebase-emulators.out > firebase-emulators-scrubbed.out
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-debug
          path: |
            web/test-results/
            web/playwright-report/
            firebase-emulators-scrubbed.out
          retention-days: 7

  deploy:
    # Continuous deployment (plan §21 B12). Runs only after every other job in
    # this workflow is green — a red check cannot deploy by construction.
    #
    # STAGED ROLLOUT (B12 item 8): for now this runs on manual dispatch only
    # (Actions → CI → Run workflow → pick the project). There is no dev
    # project, so the dry run was a dispatched production deploy. Five of
    # those were clean on 2026-11-17 (smoke test incl. the functions-version
    # check), so merges to main now deploy themselves (plan §21 B12 item 8);
    # dispatch remains for rollback (`deploy_ref`) and for re-running. A
    # merge-triggered run is gated exactly like a dispatched one: the same
    # five jobs, with the iOS emulator steps widened above to run on main.
    #
    # Credentials: Workload Identity Federation — GitHub's OIDC token is
    # exchanged for a ~1 h Google token; there is no key or secret anywhere.
    # The two identifiers below are NOT secrets; they are variables on the
    # GitHub Environment `production`, which also carries a
    # required-reviewer rule so a deploy waits for a click.
    needs: [build-test, secret-scan, emulator-tests, ios-build-test, e2e-test]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_project != 'none' &&
       (inputs.deploy_project != 'obc-dance-card' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # Two deploys to one project never interleave; a queued one waits.
      group: deploy-${{ inputs.deploy_project || 'obc-dance-card' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # mint the OIDC token for federation — nothing else
    env:
      FIREBASE_PROJECT: ${{ inputs.deploy_project || 'obc-dance-card' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.deploy_ref || github.sha }}
          # Full history: the next step needs `origin/main` to prove the
          # deploy ref is a commit that has already been on main.
          fetch-depth: 0

      - name: Require the deploy ref to be a commit already on main
        # The gating jobs above ran on the dispatched main head, not on
        # `deploy_ref`. Rolling back to an earlier main commit is fine (it was
        # tested when it merged); an arbitrary branch or tag would bypass the
        # gate (security review 2026-11-17, T2).
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main — only commits that have merged to main can be deployed." >&2
            exit 1
          fi
          echo "deploying $(git rev-parse --short HEAD), an ancestor of origin/main"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the project's committed config exists
        # The functions' non-secret config is read from the repo, never from a
        # laptop (security review M3). Fail before touching production.
        run: |
          f="firebase/functions/.env.${FIREBASE_PROJECT}"
          if [ ! -f "$f" ]; then
            echo "::error::$f is not committed — refusing to deploy without the project's config." >&2
            exit 1
          fi
          if grep -q -E '^(SMTP_USER|SMTP_PASS|LOGIN_CODE_PEPPER|EMAIL_PROVIDER_KEY)=' "$f"; then
            echo "::error::$f declares a name that must be a Secret Manager secret." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # Order matters (B12): functions are backward compatible with the old
      # client and rules; rules may depend on fields functions write; hosting
      # goes last so the new client never meets old functions.
      - name: Deploy functions
        run: npm run deploy:functions -- --non-interactive

      - name: Deploy Firestore rules and indexes
        run: npm run deploy:rules -- --non-interactive

      - name: Deploy hosting
        run: npm run deploy:hosting -- --non-interactive

      - name: Post-deploy smoke test
        # The CLI exiting 0 only means the upload was accepted. This fails the
        # job (and notifies) if the site, the version or the functions are not
        # actually live. No automatic rollback: re-dispatch with deploy_ref.
        run: node scripts/post-deploy-smoke.mjs --project "$FIREBASE_PROJECT" --expect-sha "$(git rev-parse HEAD)"
