name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (shared → web → functions)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  emulator-tests:
    # Combines the Firestore rules suite and the functions-against-emulator
    # suite in one job: both need the same Java + Firestore/Auth emulator
    # setup, so running them separately just pays that setup cost twice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build -w @obc/shared

      - name: Firestore rules tests
        run: npm run test:rules -w @obc/functions

      - name: Functions emulator tests
        run: npm run test:emu -w @obc/functions

  e2e-test:
    # Full-stack browser E2E: emulators + seed, then Playwright (which owns the
    # Vite dev server via webServer). Robust now — the auth-throttle reset
    # fixture removes the login-code rate limit as a flake source, and
    # Playwright retries twice on CI.: emulators + seed + `npm run dev -w
    # web` + `npm run test:e2e -w web` all green. See web/README.md for the
    # manual sequence this mirrors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build (shared → web → functions)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Write local-dev secrets for the emulator
        run: |
          echo "LOGIN_CODE_PEPPER=ci-dev-pepper" > firebase/functions/.secret.local
          echo "SMTP_PASS=ci-dev-smtp-pass" >> firebase/functions/.secret.local

      - name: Start emulators
        run: nohup npm run emulators > firebase-emulators.out 2>&1 &

      - name: Wait for emulators
        run: |
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" firebase-emulators.out 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulators did not start in time" >&2
          cat firebase-emulators.out || true
          exit 1

      - name: Seed emulator data
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          GCLOUD_PROJECT: demo-obc
        run: npm run seed

      - name: Run Playwright E2E
        env:
          OBC_EMULATOR_LOG: ${{ github.workspace }}/firebase-emulators.out
          LOGIN_CODE_PEPPER: ci-dev-pepper
        run: npm run test:e2e -w web

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            web/test-results/
            web/playwright-report/
            firebase-emulators.out
          retention-days: 7
