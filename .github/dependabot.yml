version: 2
updates:
  # Root npm workspace covers `shared`, `web`, and `firebase/functions` in one
  # go (they share the root `package-lock.json`) — plan §8.1 "Supply chain".
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # The Firebase web SDK and its rules-testing harness pin each other's
      # major (`@firebase/rules-unit-testing` 5 ↔ `firebase` 12, 6 ↔ 13).
      # Bumped separately, each PR installs a second, mismatched copy of
      # `firebase/firestore` and every rules test fails with "Expected first
      # argument to doc() to be … FirebaseFirestore" (PRs #121/#122,
      # 2026-11-17). Always bump them together, majors included.
      firebase-web-sdk:
        patterns:
          - firebase
          - "@firebase/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 (the native compiler) is not yet supported by
      # typescript-eslint 8.x — the install itself ERESOLVEs (PR #22,
      # 2026-09-05). Lift once typescript-eslint declares TS 7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node must track the runtime, not the newest release: functions
      # run on Node 22 (`firebase.json` runtime, CI node-version), so 22.x is
      # the right major. Dependabot only ever proposes the latest (PR #38
      # offered 26). Bump this by hand when the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
