version: 2
updates:
  # Root npm workspace covers `shared`, `web`, and `firebase/functions` in one
  # go (they share the root `package-lock.json`) — plan §8.1 "Supply chain".
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
